<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Post</title>
</head>
<body class="bg-dark">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-12">
                <form id="create-post" class="bg-dark text-white shadow p-3">
                    <div class="form-group mb-3">
                        <label for="">Agrega una imagen</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="imagen"
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="">Autor</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="autor"
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="">Agrega un avatar</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="avatar"
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="">Fecha de Publicacion</label>
                        <input 
                            type="date" 
                            class="form-control" 
                            name="fecha"
                        />
                    </div>
                    <div class="form-group mb-3">
                        <label for="">Titulo</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="titulo"
                        />
                    </div>
                    <!-- Tags -->
                    <div class="form-group mb-3">
                        <label for="inputList" class="form-label">Tags seleccionados:</label>
                        <input 
                            name="tags" 
                            type="text" 
                            class="form-control" 
                            id="inputList" hidden>
                        <div id="displayOptions" class="d-flex flex-row align-items-center gap-2"></div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="selectOption" class="form-label">Elige solo 4 tags:</label>
                        <select class="form-select" id="selectOption">
                            <option disabled selected></option>
                            <option>#webdev</option>
                            <option>#javascript</option>
                            <option>#beginners</option>
                            <option>#programming</option>
                            <option>#tutorial</option>
                            <option>#css</option>
                            <option>#api</option>
                            <option>#coding</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="">Escribe tu contenido aqui:</label>
                        <input 
                            type="text"
                            class="form-control"
                            name="contenido"/>
                    </div>
                    <button id="save-post" type="button" class="btn btn-primary">Guardar post</button>
                </form>
            </div>
        </div>
    </div>
    <script src="./index.js" type="module"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
